# OSPS Baseline v2026.02.19 coverage map (advisory).
#
# Single source of truth for the kit -> OpenSSF OSPS Baseline criterion mapping
# and the generated per-level coverage table (docs/osps-baseline-2026-coverage.md).
#
# IMPORTANT (honest-wording contract, asserted by tests):
#   This is an ADVISORY mapping, NOT a conformance certification. Each mapping
#   records that a bundled kit control provides a clone-visible SIGNAL TOWARD an
#   OSPS Baseline criterion. It does NOT certify OSPS conformance and does NOT
#   guarantee any OSPS maturity level. Per-control assurance is read live from
#   the control catalog (never duplicated here). Gaps are real and intentional.
#
# Criteria + maturity levels are transcribed from the signed upstream tag
# (see source_tag). The OSPS Baseline is a rolling release; this file pins a
# snapshot so re-maps are deliberate, not accidental.

version: v2026.02.19
source: https://github.com/ossf/security-baseline
source_tag: v2026.02.19
profile: osps-baseline-2026-1
disclaimer: >-
  Advisory mapping only. Each entry records that a bundled kit control provides a
  clone-visible signal toward an OSPS Baseline criterion; it is not a certification
  of OSPS conformance and does not guarantee any OSPS maturity level. Coverage maps
  the criteria that are expressible from a clone, never the whole baseline. Gaps are
  real and intentional.

# --- The 41 OSPS Baseline v2026.02.19 criteria (8 families). ---
# levels = the maturity levels at which the criterion is applicable upstream.
criteria:
  - {id: OSPS-AC-01, family: AC, levels: [1, 2, 3], objective: "Reduce account compromise risk via multi-factor authentication"}
  - {id: OSPS-AC-02, family: AC, levels: [1, 2, 3], objective: "Minimize unauthorized access through restricted repository permissions"}
  - {id: OSPS-AC-03, family: AC, levels: [1, 2, 3], objective: "Prevent accidental primary-branch modification or deletion"}
  - {id: OSPS-AC-04, family: AC, levels: [2, 3], objective: "Limit CI/CD pipeline permissions to the minimum needed"}
  - {id: OSPS-BR-01, family: BR, levels: [1, 2, 3], objective: "Prevent untrusted input in build and release pipelines"}
  - {id: OSPS-BR-02, family: BR, levels: [2, 3], objective: "Assign unique version identifiers to releases"}
  - {id: OSPS-BR-03, family: BR, levels: [1, 2, 3], objective: "Use encrypted channels for development activity"}
  - {id: OSPS-BR-04, family: BR, levels: [2, 3], objective: "Publish a changelog with software releases"}
  - {id: OSPS-BR-05, family: BR, levels: [2, 3], objective: "Use standardized dependency management tooling"}
  - {id: OSPS-BR-06, family: BR, levels: [2, 3], objective: "Include signatures and hashes with releases"}
  - {id: OSPS-BR-07, family: BR, levels: [1, 3], objective: "Secure secrets and credentials in the project"}
  - {id: OSPS-DO-01, family: DO, levels: [1, 2, 3], objective: "Comprehensive user guides for basic functionality"}
  - {id: OSPS-DO-02, family: DO, levels: [1, 2, 3], objective: "Enable defect-reporting mechanisms for users"}
  - {id: OSPS-DO-03, family: DO, levels: [3], objective: "Enable verification of software authenticity and integrity"}
  - {id: OSPS-DO-04, family: DO, levels: [3], objective: "Communicate support lifecycle expectations clearly"}
  - {id: OSPS-DO-05, family: DO, levels: [3], objective: "Document security update scope and duration"}
  - {id: OSPS-DO-06, family: DO, levels: [2, 3], objective: "Describe dependency selection and tracking methods"}
  - {id: OSPS-DO-07, family: DO, levels: [2, 3], objective: "Provide source-code build instructions"}
  - {id: OSPS-GV-01, family: GV, levels: [2, 3], objective: "Publish project roles and responsibilities"}
  - {id: OSPS-GV-02, family: GV, levels: [1, 2, 3], objective: "Enable public discussion mechanisms for feedback"}
  - {id: OSPS-GV-03, family: GV, levels: [1, 2, 3], objective: "Publish a contribution guide"}
  - {id: OSPS-GV-04, family: GV, levels: [3], objective: "Vet contributors before granting elevated access"}
  - {id: OSPS-LE-01, family: LE, levels: [2, 3], objective: "Require contributors to assert legal right to commit"}
  - {id: OSPS-LE-02, family: LE, levels: [1, 2, 3], objective: "Ensure project licenses meet OSI or FSF definitions"}
  - {id: OSPS-LE-03, family: LE, levels: [1, 2, 3], objective: "Maintain licenses in well-known locations"}
  - {id: OSPS-QA-01, family: QA, levels: [1, 2, 3], objective: "Enable source-code access and review for transparency"}
  - {id: OSPS-QA-02, family: QA, levels: [1, 2, 3], objective: "Provide transparency on project dependencies"}
  - {id: OSPS-QA-03, family: QA, levels: [2, 3], objective: "Ensure automated checks pass before accepting changes"}
  - {id: OSPS-QA-04, family: QA, levels: [1, 2, 3], objective: "Hold all codebases to consistent security standards"}
  - {id: OSPS-QA-05, family: QA, levels: [1, 2, 3], objective: "Remove generated executables and unreviewable binaries"}
  - {id: OSPS-QA-06, family: QA, levels: [2, 3], objective: "Run automated testing in CI/CD before merges"}
  - {id: OSPS-QA-07, family: QA, levels: [3], objective: "Require non-author human approval before merging"}
  - {id: OSPS-SA-01, family: SA, levels: [2, 3], objective: "Document system actors and actions (design)"}
  - {id: OSPS-SA-02, family: SA, levels: [2, 3], objective: "Describe external interfaces for integration"}
  - {id: OSPS-SA-03, family: SA, levels: [2, 3], objective: "Perform security assessment and threat modeling"}
  - {id: OSPS-VM-01, family: VM, levels: [2, 3], objective: "Establish a coordinated vulnerability disclosure policy"}
  - {id: OSPS-VM-02, family: VM, levels: [1], objective: "Publish security contacts and reporting process"}
  - {id: OSPS-VM-03, family: VM, levels: [2, 3], objective: "Provide a private vulnerability reporting mechanism"}
  - {id: OSPS-VM-04, family: VM, levels: [2, 3], objective: "Ensure public visibility of discovered vulnerabilities"}
  - {id: OSPS-VM-05, family: VM, levels: [3], objective: "Define and enforce dependency remediation thresholds"}
  - {id: OSPS-VM-06, family: VM, levels: [3], objective: "Define and enforce application security testing policy"}

# --- Kit control -> OSPS criterion signal map (conservative). ---
# `control` must be a real control in the bundled catalog AND a member of the
# `osps-baseline-2026-1` profile. `criteria` lists every OSPS criterion the
# control provides a clone-visible signal toward (primary + defensible secondary).
# Assurance is NOT stored here; the generator reads it from the catalog.
mappings:
  - {control: ORG-MFA-001, criteria: [OSPS-AC-01]}
  - {control: GH-PLAT-024, criteria: [OSPS-AC-02, OSPS-AC-03]}
  - {control: PLAT-BRPROT-015, criteria: [OSPS-AC-03]}
  - {control: CI-PERM-006, criteria: [OSPS-AC-04]}
  - {control: CI-PIN-008, criteria: [OSPS-BR-01]}
  - {control: REL-CHANGE-012, criteria: [OSPS-BR-04]}
  - {control: DEP-UPDATE-001, criteria: [OSPS-BR-05, OSPS-VM-05]}
  - {control: GH-PROV-023, criteria: [OSPS-BR-06]}
  - {control: SEC-SECRETS-050, criteria: [OSPS-BR-07]}
  - {control: GOV-CON-002, criteria: [OSPS-GV-03]}
  - {control: GOV-LIC-004, criteria: [OSPS-LE-03, OSPS-LE-02]}
  - {control: BUILD-SBOM-QUAL-003, criteria: [OSPS-QA-02]}
  - {control: SEC-DEPREV-011, criteria: [OSPS-QA-03, OSPS-BR-05]}
  - {control: SEC-CODEQL-010, criteria: [OSPS-VM-06, OSPS-QA-04]}
  - {control: CI-WF-005, criteria: [OSPS-QA-06]}
  - {control: GOV-COWN-003, criteria: [OSPS-QA-07, OSPS-AC-02]}
  - {control: GOV-DISC-013, criteria: [OSPS-VM-01, OSPS-VM-03]}
  - {control: GOV-SEC-001, criteria: [OSPS-VM-02]}

# Aggregate control: consumes the external Scorecard v6 OSPS conformance verdict
# (spans all families) when evidence is present. It is NOT counted toward
# per-criterion coverage because it asserts the upstream verdict, not a specific
# clone-visible criterion. See ADR-018.
aggregate_controls:
  - {control: OSPS-SCORECARD-V6-001, note: "Consumes scorecard --format=osps conformance verdict (all families) when evidence present; manual review otherwise."}
