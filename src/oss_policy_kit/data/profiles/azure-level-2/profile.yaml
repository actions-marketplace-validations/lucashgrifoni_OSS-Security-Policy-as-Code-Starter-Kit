id: azure-level-2
title: Azure — advisory (level 2)
description: >
  **Advisory** profile for day-to-day use: starter scope plus secure template posture (`extends`),
  deployment identity YAML signals (**AZ-IDENT-036**), the full pipeline signal bundle, dependency
  auto-update detection, and container image security posture checks (digest pinning, non-root user,
  image scanning signals — not-applicable when no Dockerfile present). Platform truth (branch
  policies, environments, service connections) still requires evidence or **collect-evidence** —
  not inferred as a hard gate here.
  **Natural next step:** `azure-level-3` for the evidence-backed hard-gate, or `azure-release-hardening-2`
  for the release ladder at advisory depth.
audience: Teams with mature Azure Pipelines seeking stronger local discipline before evidence files.
