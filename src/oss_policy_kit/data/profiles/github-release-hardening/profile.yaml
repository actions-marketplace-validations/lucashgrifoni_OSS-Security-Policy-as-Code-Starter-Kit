id: github-release-hardening
title: GitHub release hardening add-on (legacy id — use `github-release-hardening-1`)
description: >
  **Legacy profile id — do not cite in new documentation, UX, CI gates, or automation.**
  The canonical id is `github-release-hardening-1`; this YAML is kept only for backwards
  compatibility when a filesystem path to this file is used directly. When you pass
  `--profile github-release-hardening` without a path, the kit resolves the same control set
  as `github-release-hardening-1` from the canonical profile directory. New adopters should
  always prefer `github-release-hardening-1`.
  **Natural next step:** change automation and docs to use the canonical id `github-release-hardening-1`; then follow that profile's ladder (`-2`, `-3`).
audience: Teams preparing for safer releases and stricter repository settings.
controls:
  - GOV-SEC-001
  - GOV-CON-002
  - GOV-COWN-003
  - GOV-LIC-004
  - CI-WF-005
  - CI-PERM-006
  - CI-DANGER-007
  - CI-PIN-008
  - CI-LEAST-009
  - SEC-CODEQL-010
  - SEC-DEPREV-011
  - REL-CHANGE-012
  - GOV-DISC-013
  - GOV-WAIV-014
  - PLAT-BRPROT-015
  - GOV-EVIDFRESH-054
