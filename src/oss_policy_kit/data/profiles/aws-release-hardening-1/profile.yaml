id: aws-release-hardening-1
title: AWS release hardening — starter + evidence (level 1)
description: >
  **Starter + evidence:** extends **aws-level-1** with self-attested CodePipeline promotion and CodeBuild project
  JSON. Use when you need release documentation gates without level-2 pipeline export discipline.
  **Natural next step:** `aws-release-hardening-2` or `aws-level-2` for export validation before the level-3 hard-gate.
audience: Teams preparing AWS releases with minimal evidence scaffolding.
