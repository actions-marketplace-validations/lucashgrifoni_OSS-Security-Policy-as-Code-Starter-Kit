id: azure-release-hardening-1
title: Azure release hardening — starter + evidence (level 1)
description: >
  **Starter + evidence:** extends **azure-level-1** with **AZ-PLAT-034** and **AZ-PLAT-035** evidence for branch
  policies and pipeline governance (self-attested or API-collected).
  **Natural next step:** `azure-release-hardening-2` or `azure-level-2` for stronger pipeline posture before the level-3 hard-gate.
audience: Teams preparing releases with governance JSON before adopting the full advisory ladder.
controls:
