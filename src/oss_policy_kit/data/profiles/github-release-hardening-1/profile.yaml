id: github-release-hardening-1
title: GitHub release hardening add-on (level 1 — canonical)
description: >
  **Starter + evidence**: extends the level-1 baseline with default-branch protection evidence
  and freshness checks for collected JSON under `.oss-policy-kit/evidence/`.
  This is the **canonical** release-hardening entrypoint; `github-release-hardening` remains
  a legacy alias that resolves to the same control set.
  **Natural next step:** `github-release-hardening-2` or `github-level-2` for broader workflow posture
  without the full level-3 hard-gate.
audience: Teams preparing for safer releases and stricter repository settings.
controls:
  - GOV-SEC-001
  - GOV-CON-002
  - GOV-COWN-003
  - GOV-LIC-004
  - CI-WF-005
  - CI-PERM-006
  - CI-DANGER-007
  - CI-PIN-008
  - CI-LEAST-009
  - SEC-CODEQL-010
  - SEC-DEPREV-011
  - REL-CHANGE-012
  - GOV-DISC-013
  - GOV-WAIV-014
  - PLAT-BRPROT-015
  - GOV-EVIDFRESH-054
