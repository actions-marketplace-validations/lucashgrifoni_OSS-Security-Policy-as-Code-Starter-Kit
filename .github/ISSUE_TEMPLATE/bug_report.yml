name: Bug report
description: Report a functional defect in the kit, templates, or examples.
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug.

        Do not use this form for undisclosed security vulnerabilities.
        Use the private reporting path described in `SECURITY.md`.
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: Describe the defect clearly and concisely.
      placeholder: What is broken?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Provide the smallest reliable reproduction.
      placeholder: |
        1. Run ...
        2. Evaluate ...
        3. Observe ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      placeholder: v0.1.0
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Python version, OS, shell, and any relevant CI context.
