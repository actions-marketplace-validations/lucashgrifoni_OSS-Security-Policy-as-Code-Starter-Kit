# Product CI: quality checks plus package build, twine validation, and CycloneDX SBOM artifact (supply-chain hygiene).
# Copy to .github/workflows/ and adjust Python version / install line to match your project.

name: ci
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -e ".[dev]"
      - name: Ruff check
        run: ruff check .
      - name: Ruff format
        run: ruff format --check .
      - name: Mypy
        run: python -m mypy src/oss_policy_kit
      - name: Pytest
        run: python -m pytest

  package:
    name: Package (build, twine, SBOM)
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
      - name: Install build tools
        run: |
          python -m pip install -U pip build twine cyclonedx-bom
          pip install -e ".[dev]"
      - name: Clean artifact directories
        run: |
          rm -rf dist build src/*.egg-info
      - name: Build sdist and wheel
        run: python -m build
      - name: Twine check
        run: python scripts/twine_check_dist.py
      - name: Generate CycloneDX SBOM
        run: python -m cyclonedx_py environment --output-format JSON --output-file dist/sbom.cyclonedx.json
